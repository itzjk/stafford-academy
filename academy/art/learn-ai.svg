<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Connectors from each assistant to the chat -->
  <path class="s-acc a-dash" stroke-width="2" d="M92 108 C120 130 128 140 140 150"/>
  <path class="s-acc a-dash d1" stroke-width="2" d="M308 108 C282 130 272 140 260 150"/>
  <path class="s-acc a-dash d2" stroke-width="2" d="M200 300 L200 272"/>

  <!-- The chat window -->
  <g class="a-float">
    <rect class="f-panel s-line" stroke-width="3" x="118" y="126" width="164" height="146" rx="18"/>
    <circle class="f-dim" cx="138" cy="144" r="4"/>
    <circle class="f-dim" cx="152" cy="144" r="4"/>
    <circle class="f-dim" cx="166" cy="144" r="4"/>
    <rect class="f-soft s-acc" stroke-width="2" x="168" y="160" width="98" height="30" rx="12"/>
    <path class="s-line" stroke-width="3" d="M180 175 H250"/>
    <path class="s-line a-draw" stroke-width="3" d="M134 208 H250"/>
    <path class="s-dim a-draw d1" stroke-width="3" d="M134 226 H232"/>
    <path class="s-dim a-draw d2" stroke-width="3" d="M134 244 H210"/>
    <rect class="s-acc a-blink" stroke-width="3" x="216" y="238" width="3" height="13" rx="1"/>
  </g>

  <!-- Claude: a warm starburst -->
  <g class="a-float d1">
    <circle class="f-panel s-dim" stroke-width="2" cx="78" cy="88" r="36"/>
    <g class="a-spin">
      <circle cx="78" cy="88" r="22" fill="none"/>
      <path class="s-claude" stroke-width="5" d="M78 70 V80 M78 96 V106 M60 88 H70 M86 88 H96 M65.3 75.3 L72.3 82.3 M83.7 93.7 L90.7 100.7 M90.7 75.3 L83.7 82.3 M72.3 93.7 L65.3 100.7"/>
    </g>
    <text class="t-label" x="78" y="142" text-anchor="middle">Claude</text>
  </g>

  <!-- ChatGPT: an interlaced knot of three loops -->
  <g class="a-float d2">
    <circle class="f-panel s-dim" stroke-width="2" cx="322" cy="88" r="36"/>
    <g class="a-spin">
      <circle cx="322" cy="88" r="22" fill="none"/>
      <rect class="s-line" stroke-width="3.2" x="304" y="81" width="36" height="14" rx="7"/>
      <rect class="s-line" stroke-width="3.2" x="304" y="81" width="36" height="14" rx="7" transform="rotate(60 322 88)"/>
      <rect class="s-line" stroke-width="3.2" x="304" y="81" width="36" height="14" rx="7" transform="rotate(120 322 88)"/>
    </g>
    <text class="t-label" x="322" y="142" text-anchor="middle">ChatGPT</text>
  </g>

  <!-- Gemini: a four-point sparkle -->
  <g class="a-float d3">
    <circle class="f-panel s-dim" stroke-width="2" cx="200" cy="330" r="36"/>
    <g class="a-pulse">
      <path class="f-gemini" d="M200 306 C203 322 206 326 222 330 C206 334 203 338 200 354 C197 338 194 334 178 330 C194 326 197 322 200 306 Z"/>
    </g>
    <text class="t-label" x="252" y="335">Gemini</text>
  </g>

  <!-- Sparkles -->
  <path class="f-gold a-pulse" d="M60 250 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z"/>
  <path class="f-acc a-pulse d2" d="M334 236 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z"/>
  <circle class="f-ink a-pulse d4" cx="352" cy="300" r="2.5"/>
  <circle class="f-ink a-pulse d1" cx="46" cy="190" r="2"/>
</svg>
