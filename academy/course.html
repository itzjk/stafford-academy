<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Course · Zerack Academy</title>
  <link rel="preload" href="fonts/SpaceGrotesk.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="academy.css" />
  <link rel="stylesheet" href="mascot.css" />
</head>
<body>
  <div class="sky" aria-hidden="true"><canvas id="stars"></canvas></div>

  <header class="bar"><div class="bar-in">
    <a class="brand" href="../index.html" title="Back to all courses"><img src="../icons/logo.svg" alt="" width="32" height="32"><span class="wordmark"><b>ZERACK</b><small>ACADEMY</small></span></a>
    <a class="back" href="../index.html">‹ All courses</a>
    <div class="bar-title"><b id="barTitle">COURSE</b><small id="barSubtitle">Loading</small></div>
    <div class="bar-right">
      <div class="xp"><div class="xp-track"><i class="xp-fill" id="barXpFill"></i></div><b id="barXpText">0 XP</b></div>
      <span class="level" id="barLevel">LV 1</span>
    </div>
  </div></header>

  <main class="wrap">
    <section class="c-hero">
      <div class="c-hero-text">
        <p class="course-world" id="courseWorld"></p>
        <h1 class="course-title" id="courseTitle"></h1>
        <p class="course-summary" id="courseSummary"></p>
        <div class="course-meta" id="courseMeta"></div>
        <div class="c-hero-actions">
          <a class="c-go" id="continueBtn" href="#">
            <span><small id="continueKicker">Start here</small><b id="continueTitle"></b></span>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
          <button class="c-replay" id="replayIntro" type="button" hidden>Replay intro</button>
        </div>
      </div>
      <div class="c-hero-side">
        <button class="c-teacher" id="teacher" type="button" hidden>
          <span class="c-teacher-float"><img id="teacherImg" alt=""></span>
          <svg class="c-platform" viewBox="0 0 300 80" aria-hidden="true">
            <ellipse class="c-platform-glow" cx="150" cy="40" rx="140" ry="30"/>
            <ellipse class="c-platform-track" cx="150" cy="40" rx="128" ry="26"/>
            <ellipse class="c-platform-fill" id="platformFill" cx="150" cy="40" rx="128" ry="26" pathLength="100"/>
          </svg>
        </button>
        <div class="c-teacher-tag" id="teacherTag" hidden><b id="teacherName"></b><small id="teacherRole"></small></div>
        <p class="c-progress"><b id="coursePct">0%</b><span id="courseTrackText"></span></p>
      </div>
    </section>
    <div class="map" id="chapters"></div>
  </main>

  <script src="common.js"></script>
  <script src="arcade.js"></script>
  <script src="cast.js"></script>
  <script src="mascot.js"></script>
  <script src="stage.js"></script>
  <script src="course.js"></script>
</body>
</html>
